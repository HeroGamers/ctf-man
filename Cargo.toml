[package]
name = "ctf-man"
version = "0.1.0"
edition = "2021"

[features]
# TUI support is on by default (needed for the ctf-man binary).
# Downstream libraries that only need the database / config layer can opt out:
#   ctf-man = { ..., default-features = false }
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[lib]
name = "ctf_man"
path = "src/lib.rs"

[[bin]]
name = "ctf-man"
path = "src/main.rs"
required-features = ["tui"]

[dependencies]
# TUI Framework (optional – enabled by the "tui" feature)
ratatui   = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# CLI Argument Parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP Client
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }

# Error Handling
anyhow = "1.0"

# Utilities
dirs = "5.0"
chrono = "0.4"
fs_extra = "1.3"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
